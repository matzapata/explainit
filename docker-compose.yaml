services:
  api:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    environment:
      PORT: '4000'
      NODE_ENV: development
      DATABASE_URL: postgresql://explainit:explainit@postgres:5432/explainit
      AUTH_MODE: none
      ADMIN_EMAIL: admin@example.com
      CORS_ORIGIN: http://localhost:3000
      OTEL_SERVICE_NAME: explainit
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      S3_BUCKET: explainit
      S3_ENDPOINT: http://floci:4566
      S3_PUBLIC_ENDPOINT: http://localhost:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    env_file:
      - path: ./apps/server/.env.local
        required: false
    volumes:
      - ./apps/server:/app
      - /app/node_modules
    ports:
      - '4000:4000'
    command: sh -c "npx prisma migrate deploy && npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      floci:
        condition: service_started
      jaeger:
        condition: service_started
  client:
    build:
      context: ./apps/client
      dockerfile: Dockerfile
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_AUTH_MODE: none
    env_file:
      - path: ./apps/client/.env.local
        required: false
    volumes:
      - ./apps/client:/app
      - /app/node_modules
    ports:
      - '3000:3000'
    depends_on:
      - api
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: explainit
      POSTGRES_PASSWORD: explainit
      POSTGRES_DB: explainit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U explainit -d explainit']
      interval: 5s
      timeout: 5s
      retries: 10
  floci:
    image: floci/floci:latest
    restart: unless-stopped
    ports:
      - '4566:4566'
    volumes:
      - floci_data:/app/data
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_BASE_URL: http://localhost:4566
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_DEFAULT_REGION: us-east-1
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686'
      - '4318:4318'
      - '4317:4317'
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.route-prefix=/'
    ports:
      - '9090:9090'
    volumes:
      - ./config/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    restart: unless-stopped
    depends_on:
      - api
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '3001:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus
      - jaeger

volumes:
  postgres_data:
  floci_data:
  prometheus_data:
  grafana_data:
