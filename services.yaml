apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  annotations:
  name: explainit
spec:
  template:
    spec:
    metadata:
      annotations:
        run.googleapis.com/container-dependencies: '{"docker.io/matzapata/explainit-nginx:latest":["docker.io/matzapata/explainit-server:latest", "docker.io/matzapata/explainit-client:latest"]}'
        autoscaling.knative.dev/maxScale: 2
      containers:
      - image: docker.io/matzapata/explainit-nginx:latest
        ports:
          - containerPort: 80
      - image: docker.io/matzapata/explainit-server:latest
        ports:
          - containerPort: 4000
      - image: docker.io/matzapata/explainit-client:latest
        ports:
          - containerPort: 3000