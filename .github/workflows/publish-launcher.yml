name: Publish launcher

on:
  workflow_dispatch:
  push:
    tags:
      - 'launcher-v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            packages/launcher/package-lock.json
            apps/client/package-lock.json
      - name: Build launcher
        working-directory: packages/launcher
        run: |
          npm ci
          npm test
          npm run build
      - name: Build widget
        working-directory: apps/client
        run: |
          npm ci
          npm run build:widget
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Upload CDN artifacts
        env:
          LAUNCHER_S3_BUCKET: ${{ secrets.LAUNCHER_S3_BUCKET }}
          LAUNCHER_S3_KEY: ${{ secrets.LAUNCHER_S3_KEY }}
        run: |
          key="${LAUNCHER_S3_KEY:-launcher.js}"
          aws s3 cp packages/launcher/dist/launcher.js "s3://${LAUNCHER_S3_BUCKET}/${key}" \
            --content-type 'application/javascript; charset=utf-8' \
            --cache-control 'public, max-age=60'
          aws s3 cp apps/client/dist-widget/widget.js "s3://${LAUNCHER_S3_BUCKET}/widget.js" \
            --content-type 'application/javascript; charset=utf-8' \
            --cache-control 'public, max-age=60'
          aws s3 cp apps/client/dist-widget/widget.css "s3://${LAUNCHER_S3_BUCKET}/widget.css" \
            --content-type 'text/css; charset=utf-8' \
            --cache-control 'public, max-age=60'
          if [ -n "${{ secrets.LAUNCHER_CLOUDFRONT_DISTRIBUTION_ID }}" ]; then
            aws cloudfront create-invalidation \
              --distribution-id "${{ secrets.LAUNCHER_CLOUDFRONT_DISTRIBUTION_ID }}" \
              --paths "/${key}" "/widget.js" "/widget.css"
          fi
